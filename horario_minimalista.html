    <style>

    </main>

    <footer class="w-full py-4 text-center text-xs text-neutral-600 border-t border-neutral-900">
        <span>Horario clase</span>
    </footer>

    <script>
        function updateContext() {
            const now = new Date();
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            const dateStr = now.toLocaleDateString('es-ES', options);
            
            const timeStr = now.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });
            
            const dayIndicator = document.getElementById('current-day-indicator');
            const timeIndicator = document.getElementById('current-time-indicator');
            
            if (dayIndicator) dayIndicator.textContent = dateStr;
            if (timeIndicator) timeIndicator.textContent = timeStr;
        }

        updateContext();
        setInterval(updateContext, 60000);
    </script>
</body>
</html>
